# Konfigurasi Render untuk backend (FastAPI). Dipakai lewat New + > Blueprint.
services:
  - type: web
    name: perpus-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MONGO_URL        # isi dari MongoDB Atlas (lihat PANDUAN_DEPLOY.md)
        sync: false
      - key: DB_NAME
        value: perpus
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://perpusmansa.vercel.app
      - key: CORS_ORIGINS
        value: https://perpusmansa.vercel.app
